<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">Alexandros Chelidonis — Junior Backend Engineer</title>
  <desc id="d">Java, SQL and Docker. Based in Bulgaria.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="55%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#131D30"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5B247"/>
      <stop offset="100%" stop-color="#E07B1F"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8912D" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E8912D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#22304A"/>
    </pattern>

    <style>
      .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#dots)" opacity="0.55"/>
  <ellipse cx="76" cy="130" rx="260" ry="180" fill="url(#glowA)"/>
  <ellipse cx="1010" cy="130" rx="300" ry="190" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="none" stroke="#1E2B44" stroke-width="1"/>

  <!-- request flow: dots travel behind the nodes, so they read as passing through -->
  <line x1="838" y1="130" x2="1092" y2="130" stroke="#22304A" stroke-width="2"/>

  <g>
    <circle r="4" fill="#F5B247">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M 838 130 H 1092"/>
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/>
    </circle>
    <circle r="4" fill="#F5B247">
      <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M 838 130 H 1092"/>
      <animate attributeName="opacity" dur="3.6s" begin="1.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/>
    </circle>
    <circle r="4" fill="#F5B247">
      <animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" path="M 838 130 H 1092"/>
      <animate attributeName="opacity" dur="3.6s" begin="2.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.08;0.92;1"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="802" y="112" width="36" height="36" rx="9" fill="#0D1626" stroke="#2C3B57" stroke-width="1.6"/>
    <rect x="810" y="121" width="20" height="3" rx="1.5" fill="#4A5C7A"/>
    <rect x="810" y="128" width="14" height="3" rx="1.5" fill="#3A4A66"/>
    <rect x="810" y="135" width="17" height="3" rx="1.5" fill="#3A4A66"/>

    <rect x="902" y="112" width="36" height="36" rx="9" fill="#1A1508" stroke="#E8912D" stroke-width="1.6"/>
    <text x="920" y="136" class="mono" font-size="15" fill="#F5B247" text-anchor="middle">{ }</text>

    <rect x="1002" y="112" width="36" height="36" rx="9" fill="#0D1626" stroke="#2C3B57" stroke-width="1.6"/>
    <circle cx="1020" cy="130" r="7.5" fill="none" stroke="#4A5C7A" stroke-width="1.6"/>
    <circle cx="1020" cy="130" r="2.2" fill="#4A5C7A"/>

    <g fill="#0D1626" stroke="#2C3B57" stroke-width="1.6">
      <path d="M1092 118 v24 a20 7 0 0 0 40 0 v-24"/>
      <ellipse cx="1112" cy="118" rx="20" ry="7"/>
    </g>
    <ellipse cx="1112" cy="129" rx="20" ry="7" fill="none" stroke="#22304A" stroke-width="1.3"/>
  </g>

  <g class="mono" font-size="11" fill="#546584" text-anchor="middle">
    <text x="820" y="174">client</text>
    <text x="920" y="174">api</text>
    <text x="1020" y="174">service</text>
    <text x="1112" y="174">db</text>
  </g>

  <!-- identity -->
  <rect x="64" y="78" width="4" height="104" rx="2" fill="url(#bar)"/>

  <text x="90" y="124" class="sans" font-size="46" font-weight="700" fill="#F1F5F9" letter-spacing="-0.8">Alexandros Chelidonis</text>
  <text x="92" y="157" class="sans" font-size="15" font-weight="700" fill="#E8912D" letter-spacing="3.4">JUNIOR BACKEND ENGINEER</text>
  <text x="92" y="187" class="mono" font-size="14" fill="#64748B">Java &#183; SQL &#183; Docker &#8194;&#183;&#8194; Bulgaria</text>
</svg>
